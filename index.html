<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESPDuino-32 Control Global</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      position: relative; /* Para posicionar el círculo en la esquina */
      background: var(--card);
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    /* Indicador circular de estado de conexión en la esquina superior derecha */
    .connection-status {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: var(--danger); /* Inicia en rojo por defecto */
      box-shadow: 0 0 8px var(--danger);
      transition: background-color 0.3s, box-shadow 0.3s;
    }
    .connection-status.online {
      background-color: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--accent); }
    p.subtitle { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
    .status-box {
      background: rgba(255,255,255,0.05);
      padding: 1rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .badge.off { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .badge.on { background: rgba(34, 197, 94, 0.2); color: var(--success); }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: var(--bg);
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .footer { font-size: 0.75rem; color: var(--text-muted); margin-top: 1.5rem; }
  </style>
</head>
<body>
  <div class="card">
    <!-- Círculo de estado en la esquina superior derecha -->
    <div id="status-indicator" class="connection-status" title="Estado de la ESP32"></div>

    <h1>ESPDuino-32</h1>
    <p class="subtitle">Control Global MQTT</p>
    
    <div class="status-box">
      <span>Estado LED (IO2)</span>
      <span id="led-badge" class="badge off">APAGADO</span>
    </div>

    <button class="btn" onclick="toggleLED()">Cambiar Estado</button>

    <div class="footer" id="log-info">Esperando conexión de la ESP32...</div>
  </div>

  <script>
    const topicCmd = 'esp32_red_direct/led/cmd';
    const topicStatus = 'esp32_red_direct/led/status';

    // Conexión WSS requerida para GitHub Pages
    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

    let currentLedState = "0";

    client.on('connect', () => {
      client.subscribe(topicStatus);
    });

    client.on('error', (err) => {
      setESP32Connected(false);
      console.error(err);
    });

    // Recibir mensajes desde la ESP32
    client.on('message', (topic, message) => {
      if (topic === topicStatus) {
        // Al recibir cualquier reporte de estado de la ESP32, activamos el círculo verde
        setESP32Connected(true);

        currentLedState = message.toString();
        const badge = document.getElementById('led-badge');
        if (currentLedState === '1') {
          badge.innerText = 'ENCENDIDO';
          badge.className = 'badge on';
        } else {
          badge.innerText = 'APAGADO';
          badge.className = 'badge off';
        }
      }
    });

    // Función para cambiar el color del círculo en la esquina
    function setESP32Connected(isConnected) {
      const indicator = document.getElementById('status-indicator');
      const logInfo = document.getElementById('log-info');

      if (isConnected) {
        indicator.classList.add('online');
        logInfo.innerText = "ESP32 Vinculada y Conectada";
      } else {
        indicator.classList.remove('online');
        logInfo.innerText = "ESP32 Desconectada";
      }
    }

    function toggleLED() {
      const newState = currentLedState === '1' ? '0' : '1';
      client.publish(topicCmd, newState);
    }
  </script>
</body>
</html>
